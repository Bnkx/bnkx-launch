<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BNKX Launch</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: #d4af37;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      background-color: black;
      padding: 20px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 999;
      border-bottom: 1px solid #d4af37;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      font-size: 18px;
    }
    nav a {
      color: #d4af37;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      max-width: 700px;
      margin: 120px auto 0;
      padding: 20px;
    }
    img {
      width: 220px;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 40px;
      color: #d4af37;
      margin-bottom: 25px;
    }
    p {
      color: #ccc;
      font-size: 20px;
      margin-bottom: 40px;
    }
    .countdown-box {
      background-color: #1a1a1a;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 20px #d4af37aa;
      margin: 40px auto;
      max-width: 400px;
    }
    .countdown-box h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #d4af37;
    }
    .countdown-box #presale-status {
      color: #ff4d4d;
      font-size: 20px;
      margin-bottom: 10px;
    }
    .countdown-box #countdown-text {
      font-size: 18px;
      color: #ccc;
    }
    .countdown-box #countdown {
      font-size: 28px;
      font-weight: bold;
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .countdown-box a {
      background-color: #d4af37;
      color: black;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      display: inline-block;
    }
    .countdown-box a:hover {
      background-color: #ffd700;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="#about">About</a>
      <a href="#team">Team</a>
      <a href="https://my.visme.co/view/w4nnqvxk-finance-research-presentation-modern" target="_blank">Whitepaper</a>
      <a href="https://bnkx.net/Whitepaper.pdf" target="_blank">Download PDF</a>
      <a href="https://t.me/BNKX_Community" target="_blank">Telegram</a>
      <a href="https://twitter.com/BNKX_Official" target="_blank">Twitter</a>
      <a href="#faq">FAQ</a>
      <a href="https://www.pinksale.finance/launchpad/0xfd73cCF13F1DAaFb807FAdf03Cef21ef06aC8f63?chain=BSC" target="_blank" class="pill">🔗 Join Presale on PinkSale</a>
    </nav>
  </header>

  <div class="container">
    <img src="logo.png" alt="BNKX Official Logo">
    <h1>BNKX is Reaching New Heights</h1>
    <p>The future of digital finance begins here. Affordable, accessible, and ambitious – just like you.</p>

    <div class="countdown-box">
      <h2>⏳ BNKX Presale Countdown</h2>
      <p id="presale-status"></p>
      <p id="countdown-text"></p>
      <div id="countdown"></div>
      <a href="https://www.pinksale.finance/launchpad/0xfd73cCF13F1DAaFb807FAdf03Cef21ef06aC8f63?chain=BSC" target="_blank">Join Presale</a>
    </div>

    <!-- باقي الصفحة سيبقى كما هو بدون تغيير هنا -->
  </div>

  <script>
    const presaleStatus = document.getElementById("presale-status");
    const countdownText = document.getElementById("countdown-text");
    const countdown = document.getElementById("countdown");

    const presaleStart = new Date("2025-08-03T00:00:00Z");
    const presaleEnd = new Date("2025-09-03T00:00:00Z");

    function updateCountdown() {
      const now = new Date();

      let target;
      let label;

      if (now < presaleStart) {
        target = presaleStart;
        label = "Presale starts in:";
        presaleStatus.innerHTML = "";
      } else if (now >= presaleStart && now < presaleEnd) {
        target = presaleEnd;
        label = "Presale ends in:";
        presaleStatus.innerHTML = "🔥 Presale Active Now!";
      } else {
        countdownText.innerHTML = "❗️ Presale has ended.";
        countdown.innerHTML = "";
        presaleStatus.innerHTML = "";
        clearInterval(timer);
        return;
      }

      const diff = target - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      countdownText.innerHTML = label;
      countdown.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }

    updateCountdown();
    const timer = setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
