<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BNKX Launch</title>
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: #d4af37;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      background-color: black;
      padding: 20px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 999;
      border-bottom: 1px solid #d4af37;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      font-size: 18px;
    }
    nav a {
      color: #d4af37;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .container {
      max-width: 700px;
      margin: 120px auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img {
      width: 220px;
      margin-bottom: 40px;
    }
    h1 {
      font-size: 40px;
      color: #d4af37;
      margin-bottom: 25px;
    }
    p {
      color: #ccc;
      font-size: 20px;
      margin-bottom: 40px;
    }
    section {
      padding: 0 20px;
      scroll-margin-top: 100px;
    }
    section h2 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #d4af37;
    }
    section p, ul {
      font-size: 20px;
      color: #ccc;
      max-width: 700px;
      margin: 0 auto 40px;
      text-align: left;
    }
    table {
      margin: 0 auto 40px;
      color: #d4af37;
      font-size: 18px;
      border-collapse: collapse;
      width: 100%;
      max-width: 700px;
    }
    table th, table td {
      padding: 12px 20px;
      border: 1px solid #d4af37;
    }
    table th {
      background-color: #111;
      text-align: left;
    }
    .disclaimer {
      margin-top: 80px;
      font-size: 12px;
      color: #777;
      text-align: center;
      padding: 0 20px 40px;
    }
    .social {
      margin-top: 40px;
      font-size: 20px;
    }
    .social a {
      color: #d4af37;
      text-decoration: none;
    }
    .social a:hover {
      text-decoration: underline;
    }
    .countdown-box {
      background-color: #222;
      padding: 20px;
      border: 2px solid #d4af37;
      border-radius: 10px;
      margin-top: 40px;
      font-size: 28px;
      font-weight: bold;
      color: #d4af37;
    }
    #presaleButton {
      display: none;
      background-color: #d4af37;
      color: black;
      padding: 14px 30px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 10px;
      box-shadow: 0 0 10px #d4af37;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="#about">About</a>
      <a href="#tokenomics">Tokenomics</a>
      <a href="#roadmap">Roadmap</a>
      <a href="#team">Team</a>
      <a href="#faq">FAQ</a>
      <a href="https://my.visme.co/view/w4nnqvxk-finance-research-presentation-modern" target="_blank">Whitepaper</a>
      <a href="https://bnkx.net/Whitepaper.pdf" target="_blank">PDF</a>
      <a href="https://t.me/BNKX_Community" target="_blank">Telegram</a>
      <a href="https://twitter.com/BNKX_Official" target="_blank">Twitter</a>
    </nav>
  </header>

  <div class="container">
    <img src="logo.png" alt="BNKX Official Logo">
    <h1>BNKX is Reaching New Heights</h1>
    <p>The future of digital finance begins here. Affordable, accessible, and ambitious – just like you.</p>

    <div class="countdown-box" id="countdown">
      ⏳ Launching in: <span id="days">--</span> Days 
      <span id="hours">--</span> Hours 
      <span id="minutes">--</span> Minutes 
      <span id="seconds">--</span> Seconds
    </div>

    <a id="presaleButton" href="https://www.pinksale.finance/launchpad/bsc/0x30474a135F3f1F70699540c4a355CbdB1986249d" target="_blank">
      🚀 Join Presale Now
    </a>
  </div>

  <!-- باقي الأقسام مثل About، Tokenomics، Roadmap، Team، FAQ، Disclaimer -->
  <!-- تم دمجها كاملة في النسخة داخل المستند -->

  <script>
    const countdownDate = new Date("2025-08-03T00:00:00+03:00").getTime();
    const updateCountdown = () => {
      const now = new Date().getTime();
      const distance = countdownDate - now;
      if (distance <= 0) {
        document.getElementById("countdown").style.display = "none";
        document.getElementById("presaleButton").style.display = "inline-block";
        return;
      }
      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      document.getElementById("days").innerText = days;
      document.getElementById("hours").innerText = hours;
      document.getElementById("minutes").innerText = minutes;
      document.getElementById("seconds").innerText = seconds;
    };
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
