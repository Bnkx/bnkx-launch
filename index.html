<script>
const countdown = document.getElementById("countdown");
const countdownLabel = document.getElementById("countdownLabel");

const startTime = new Date("2025-08-03T00:00:00Z").getTime();
const endTime = new Date("2025-08-04T00:00:00Z").getTime();

function updateCountdown() {
  const now = new Date().getTime();
  let distance, label;

  if (now < startTime) {
    distance = startTime - now;
    label = "Presale starts in:";
  } else if (now >= startTime && now <= endTime) {
    distance = endTime - now;
    label = "Presale ends in:";
  } else {
    countdown.innerHTML = "Presale has ended.";
    countdownLabel.innerHTML = "";
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  countdown.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
  countdownLabel.innerHTML = label;
}

setInterval(updateCountdown, 1000);
</script>
