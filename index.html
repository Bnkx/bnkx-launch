<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BNKX Launch</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: #d4af37;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      background-color: black;
      padding: 20px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 999;
      border-bottom: 1px solid #d4af37;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      font-size: 18px;
    }

    nav a {
      color: #d4af37;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 700px;
      margin: 120px auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    img {
      width: 220px;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 40px;
      color: #d4af37;
      margin-bottom: 25px;
    }

    p {
      color: #ccc;
      font-size: 20px;
      margin-bottom: 40px;
    }

    .btn {
      background-color: #d4af37;
      color: black;
      border: none;
      padding: 15px 35px;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 10px;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #b9942d;
    }

    .social {
      margin-top: 40px;
      font-size: 20px;
    }

    .social a {
      color: #d4af37;
      text-decoration: none;
    }

    .social a:hover {
      text-decoration: underline;
    }

    .pill {
      background-color: #d4af37;
      color: black;
      padding: 5px 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <!-- 🔹 Header Navigation -->
  <header>
    <nav>
      <a href="#about">About</a>
      <a href="Whitepaper.pdf" target="_blank">Whitepaper</a>
      <a href="https://t.me/BNKX_Community" target="_blank">Telegram</a>
      <a href="https://twitter.com/BNKX_Official" target="_blank">Twitter</a>
      <span class="pill">Coming Soon on PinkSale</span>
    </nav>
  </header>

  <!-- 🔸 Main Content -->
  <div class="container">
    <img src="logo.png" alt="BNKX Logo">
    <h1>BNKX is Reaching New Heights</h1>
    <p>The future of digital finance begins here. Affordable, accessible, and ambitious – just like you.</p>
    <div>
      <button class="btn" onclick="window.open('Whitepaper.pdf', '_blank')">View Whitepaper</button>
      <button class="btn">Coming Soon on PinkSale</button>
      <button class="btn" onclick="window.location.href='faq.html'">View FAQ</button>
    </div>
    <div class="social">
      <a href="https://twitter.com/BNKX_Official" target="_blank">@BNKX_Official</a>
      <p style="margin-top: 30px; font-size: 18px;">📧 Official Contact: <a href="mailto:bnkx@mail.com" style="color:#d4af37;">bnkx@mail.com</a></p>
    </div>
  </div>
</body>
</html>
